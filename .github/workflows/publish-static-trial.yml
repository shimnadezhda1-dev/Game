name: Publish static trial

on:
  push:
    branches: [pages-trial]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-trial
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
