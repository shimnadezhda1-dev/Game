<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="refresh" content="0;url=/Game/?return=success" />
    <title>Весёлый алфавит</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef6ff; color: #2f4f78; font: 700 18px/1.4 Nunito, "Segoe UI", sans-serif; }
      main { width: min(460px, calc(100% - 32px)); padding: 24px 18px; border-radius: 26px; background: #fffdf8; text-align: center; }
      a { color: #1d4a72; }
    </style>
  </head>
  <body>
    <main>
      <h1>Проверяем оплату</h1>
      <p>Оплата передана на проверку. Сейчас откроется игра.</p>
      <p>Там можно вернуться в приложение „Весёлый алфавит“ или продолжить на сайте. Полная версия откроется только после проверки на сервере.</p>
      <p><a id="manual" href="/Game/?return=success">Перейти к проверке оплаты</a></p>
    </main>
    <script>
      (function () {
        var dir = location.pathname.replace(/[^/]*$/, "");
        var target = dir + "?return=success";
        var link = document.getElementById("manual");
        if (link) link.setAttribute("href", target);
        location.replace(target);
      })();
    </script>
  </body>
</html>
